<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 마법 주문 제작소</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --magic-purple: #8e44ad;
            --magic-gold: #f1c40f;
            --magic-pink: #ff9ff3;
            --magic-white: rgba(255, 255, 255, 0.92);
        }

        body {
            font-family: 'Gaegu', cursive;
            /* 신비롭고 밝은 보라색 마법 밤하늘 그라데이션 배경 */
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%), 
                        url('https://www.transparenttextures.com/patterns/stardust.png'); /* 별가루 효과 추가 */
            background-attachment: fixed;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 메인 카드 디자인 (기능 및 디자인 유지) */
        .container {
            background: var(--magic-white);
            width: 90%;
            max-width: 750px;
            padding: 30px;
            border-radius: 50px;
            border: 10px solid var(--magic-gold);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            backdrop-filter: blur(8px);
        }

        /* 반짝이는 효과 */
        .container::before {
            content: '✨';
            position: absolute;
            top: -30px; left: -30px; font-size: 50px;
            animation: floating 2s infinite ease-in-out;
        }
        .container::after {
            content: '🌈';
            position: absolute;
            bottom: -30px; right: -30px; font-size: 50px;
            animation: floating 2s infinite ease-in-out 1s;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-size: 3.2rem;
            color: var(--magic-purple);
            margin: 5px 0;
            text-shadow: 2px 2px 0px white;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #444;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.7);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 25px;
            font-weight: bold;
        }

        /* 입력창 영역 (기능 및 디자인 유지) */
        .input-section {
            background: #fdfaff;
            padding: 20px;
            border-radius: 35px;
            border: 3px dashed var(--magic-pink);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: white;
            padding: 8px 20px;
            border-radius: 25px;
            border: 2px solid #f0f0f0;
            transition: 0.3s;
        }

        .input-group:focus-within {
            border-color: var(--magic-purple);
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(142, 68, 173, 0.1);
        }

        .input-label {
            flex: 0 0 130px;
            font-size: 1.6rem;
            color: var(--magic-purple);
            text-align: left;
        }

        input[type="text"], select {
            flex: 1;
            padding: 8px;
            border: none;
            font-size: 1.5rem;
            font-family: 'Gaegu', cursive;
            background: transparent;
            outline: none;
            color: #333;
        }

        /* 결과창 (기능 및 디자인 유지) */
        .result-box {
            background: #fffef0;
            padding: 15px;
            border-radius: 25px;
            border: 3px solid var(--magic-gold);
            margin: 20px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #result-display {
            font-size: 1.7rem;
            font-weight: bold;
            color: #2c3e50;
        }

        /* 버튼 영역 (기능 및 디자인 유지) */
        .button-bar {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-size: 1.7rem;
            font-family: 'Gaegu', cursive;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
        }

        .btn-preview { background: #9b59b6; }
        .btn-copy { background: #2ecc71; }
        .btn-clear { background: #e74c3c; }

        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn:active { transform: translateY(2px); box-shadow: none; }

        /* 커스텀 모달 (기능 및 디자인 유지) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(3px);
        }

        .modal {
            background: white;
            padding: 40px;
            border-radius: 40px;
            border: 6px solid var(--magic-purple);
            text-align: center;
            max-width: 450px;
            width: 85%;
            animation: magicShow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes magicShow {
            from { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .modal-text { font-size: 2rem; margin-bottom: 25px; color: #333; line-height: 1.4; }
        .modal-btn {
            background: var(--magic-purple);
            color: white; border: none; padding: 12px 35px;
            border-radius: 20px; font-size: 1.5rem; cursor: pointer;
            font-family: 'Gaegu', cursive;
            box-shadow: 0 4px 0 #732d91;
        }
        
        .confirm-btns { display: none; gap: 10px; justify-content: center; }
    </style>
</head>
<body>

<div class="container">
    <div>
        <h1>🧙‍♀️ AI 마법 주문 제작소 🪄</h1>
        <p class="subtitle">나만의 주문을 만들면 멋진 그림이 탄생해요!</p>
    </div>

    <div class="input-section">
        <div class="input-group">
            <span class="input-label">👤 주인공</span>
            <input type="text" id="subject" placeholder="예: 무지개 망토를 입은 고양이">
        </div>

        <div class="input-group">
            <span class="input-label">🎬 장면</span>
            <input type="text" id="action" placeholder="예: 구름 위에서 피아노를 치는 모습">
        </div>

        <div class="input-group">
            <span class="input-label">🎨 스타일</span>
            <select id="style">
                <option value="지브리 애니메이션 스타일">🎬 따뜻한 만화 느낌</option>
                <option value="픽사 3D 스타일">🧸 귀여운 인형 느낌</option>
                <option value="반짝이는 유화 스타일">🖼️ 화가 아저씨 유화 느낌</option>
                <option value="화려한 팝아트 스타일">⚡ 톡톡 튀는 팝아트 느낌</option>
                <option value="진짜 같은 사진 스타일">📸 진짜 같은 사진 느낌</option>
            </select>
        </div>
    </div>

    <div class="result-box">
        <div id="result-display">어떤 마법 주문이 완성될까요? ✨</div>
    </div>

    <div class="button-bar">
        <button class="btn btn-preview" onclick="showPreview()">주문 만들기</button>
        <button class="btn btn-copy" onclick="copyToClipboard()">주문 복사</button>
        <button class="btn btn-clear" onclick="openConfirm()">새로 쓰기</button>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-text" id="modalText">마법 메시지</div>
        <div class="confirm-btns" id="confirmBtns">
            <button class="modal-btn" onclick="clearAll()" style="background:#e74c3c; box-shadow: 0 4px 0 #c0392b;">네, 지울래요!</button>
            <button class="modal-btn" onclick="closeModal()" style="background:#7f8c8d; box-shadow: 0 4px 0 #717d7e;">아니오</button>
        </div>
        <button class="modal-btn" id="closeBtn" onclick="closeModal()">확인</button>
    </div>
</div>

<script>
    function showModal(msg, isConfirm = false) {
        document.getElementById('modalText').innerText = msg;
        document.getElementById('modalOverlay').style.display = 'flex';
        const confirmBox = document.getElementById('confirmBtns');
        const closeBtn = document.getElementById('closeBtn');

        if(isConfirm) {
            confirmBox.style.display = 'flex';
            closeBtn.style.display = 'none';
        } else {
            confirmBox.style.display = 'none';
            closeBtn.style.display = 'inline-block';
        }
    }

    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
    }

    function showPreview() {
        const sub = document.getElementById('subject').value;
        const act = document.getElementById('action').value;
        const sty = document.getElementById('style').value;

        if(!sub || !act) {
            showModal('앗! 주인공과 장면을 마법으로 채워주세요! 🪄');
            return;
        }

        const prompt = `"${sub}가 ${act}하는 모습을 ${sty}로 그려줘!"`;
        document.getElementById('result-display').innerText = prompt;
    }

    function copyToClipboard() {
        const text = document.getElementById('result-display').innerText;
        if(text.includes('완성될까요') || text === "") {
            showModal('먼저 주문 만들기 버튼을 눌러주세요! 📜');
            return;
        }

        navigator.clipboard.writeText(text).then(() => {
            showModal('마법 주문이 복사되었습니다! 📋\n이제 제미나이에게 붙여넣으세요!');
        });
    }

    function openConfirm() {
        showModal('모든 주문 내용을 지우고 새로 쓸까요? 🧹', true);
    }

    function clearAll() {
        document.getElementById('subject').value = "";
        document.getElementById('action').value = "";
        document.getElementById('style').selectedIndex = 0;
        document.getElementById('result-display').innerText = "어떤 마법 주문이 완성될까요? ✨";
        closeModal();
    }
</script>

</body>
</html>
